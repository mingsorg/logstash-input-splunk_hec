plugins { id 'java' }
def pins = new Properties()
file('versions.properties').withInputStream { pins.load(it) }
group = 'org.logstashplugins.hec'
version = file('VERSION').text.trim()
repositories { mavenCentral() }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
dependencies {
    implementation "com.google.re2j:re2j:${pins['re2j.version']}"
    compileOnly fileTree(dir: '.cache/logstash-jars', include: '*.jar')
    compileOnly "joda-time:joda-time:${pins['joda.version']}"
    implementation "com.fasterxml.jackson.core:jackson-core:${pins['jackson.version']}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${pins['jackson.version']}"
    implementation "com.fasterxml.jackson.core:jackson-annotations:${pins['jackson.annotations.version']}"
    testImplementation platform("org.junit:junit-bom:${pins['junit.version']}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation fileTree(dir: '.cache/logstash-jars', include: '*.jar')
    testImplementation "joda-time:joda-time:${pins['joda.version']}"
}
dependencyLocking { lockAllConfigurations() }
test {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed', 'skipped'; exceptionFormat 'full' }
    // Gradle 8.14's captured-output reader intermittently throws Kryo EOF while
    // embedding HttpTlsTest stdout. Keep every test/assertion/failure in XML;
    // console logging remains available without embedding captured streams.
    reports.junitXml.includeSystemOutLog = false
    reports.junitXml.includeSystemErrLog = false
    // Gradle's HTML report writer intermittently fails after every case passed; the gate reads JUnit XML.
    reports.html.required = false
}
jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { zipTree(it) } }
    configurations.runtimeClasspath.each { dependency ->
        from(zipTree(dependency)) {
            include 'META-INF/LICENSE*', 'META-INF/NOTICE*'
            into "META-INF/third-party/${dependency.name}"
        }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class', 'META-INF/versions/**/module-info.class'
}
tasks.register('vendor', Sync) {
    dependsOn jar
    from tasks.jar
    into 'vendor/jars'
}
tasks.register('gem', Exec) {
    dependsOn 'vendor'
    commandLine 'docker', 'run', '--rm', '--network', 'none', '-e', 'JAVA_HOME=/usr/share/logstash/jdk',
        '-e', 'SOURCE_DATE_EPOCH=1792972800', '-v', "${projectDir}:/work", '-w', '/work',
        '--entrypoint', '/usr/share/logstash/vendor/jruby/bin/jruby', pins['logstash.latest.image'],
        '-S', 'gem', 'build', 'logstash-input-splunk_hec.gemspec'
}
