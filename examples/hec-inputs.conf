# Example policy for examples/shared-listener.conf. Replace all token values.
# Stanza names label policies; they do not restrict tokens to particular URLs.
[http]
disabled = false
index = main
ackIdleCleanup = false
maxIdleTime = 600

# Measured UF/HF httpout requests do not send a HEC request-channel GUID.
# Leave ACK off for these senders. Wire host/source/sourcetype/index take priority.
[http://forwarders]
token = REPLACE_WITH_FORWARDER_TOKEN
disabled = false
useACK = false
allowQueryStringAuth = false
# No index allowlist is set here: forwarders may also send internal indexes.
# To restrict it, set indexes to every index you intend to accept in each batch.

# Event/raw examples use this token without requiring an ACK channel.
[http://applications]
token = REPLACE_WITH_APPLICATION_TOKEN
disabled = false
index = main
indexes = main
sourcetype = application_event
useACK = false
allowQueryStringAuth = false

# Optional application token: every ingestion request must supply a GUID channel.
[http://applications_ack]
token = REPLACE_WITH_ACK_TOKEN
disabled = false
index = main
indexes = main
sourcetype = application_event
useACK = true
allowQueryStringAuth = false
