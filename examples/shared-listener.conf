# One input serves HEC event, raw and S2S HTTP concurrently on this HTTPS port.
# Copy examples/hec-inputs.conf to the configured path and replace its tokens.
# The state directory must be writable by Logstash and persist across restarts.
input {
  splunk_hec {
    host => "0.0.0.0"
    port => 8088
    ssl_enabled => true               # the default
    inputs_conf => "/etc/logstash/hec-inputs.conf"
    state_directory => "/var/lib/logstash/hec-shared"
    # Configure actual DNS/IP identities before generating the first certificate.
    ssl_self_signed_sans => "dns:localhost,dns:logs.example.test,ip:127.0.0.1,ip:::1"
  }
}

# Native envelopes remain untouched. Add your own filters/outputs explicitly.
output {
  stdout { codec => json_lines }
}
