# Payload transformations are explicit downstream choices, never input side effects.
input {
  splunk_hec {
    host => "0.0.0.0"
    port => 8088
    state_directory => "/var/lib/logstash/hec-input-1"
    inputs_conf => "/etc/logstash/hec-inputs.conf"
    ssl_self_signed_sans => "dns:localhost,dns:logs.example.test,ip:127.0.0.1,ip:::1"
  }
}

# Optional transformation example: preserve event and decode a selected sourcetype separately.
filter {
  if [sourcetype] == "application_json" {
    json { source => "event" target => "[parsed]" }
  }
}

output {
  if [@metadata][splunk_hec][id] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_URL}"]
      api_key => "${ELASTICSEARCH_API_KEY}"
      index => "logs-splunk-default"
      document_id => "%{[@metadata][splunk_hec][id]}"
    }
  } else {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_URL}"]
      api_key => "${ELASTICSEARCH_API_KEY}"
      index => "logs-splunk-default"
    }
  }
}
