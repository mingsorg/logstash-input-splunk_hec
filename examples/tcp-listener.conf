# Optional classic S2S TCP listener beside the HTTPS HEC listener.
# TLS is set PER LISTENER: HEC defaults to TLS on, the TCP listener defaults to plaintext.
# The listeners share the certificate identity, limits and queue back-pressure.
input {
  splunk_hec {
    host => "0.0.0.0"
    port => 8088                         # HEC over TLS (ssl_enabled defaults to true)
    inputs_conf => "/etc/logstash/hec-inputs.conf"
    state_directory => "/var/lib/logstash/hec-shared"
    ssl_self_signed_sans => "dns:localhost,dns:logs.example.test,ip:127.0.0.1,ip:::1"
    s2s_tcp_enabled => true
    s2s_tcp_port => 9997
    # s2s_tcp_ssl_enabled => true        # uncomment to encrypt the TCP listener as well
    s2s_tcp_default_index => "main"
    # s2s_tcp_indexes => "main,application"
    # hec_metadata => "id_only"          # full (default) | id_only | none
  }
}
output {
  stdout { codec => json_lines }
}
