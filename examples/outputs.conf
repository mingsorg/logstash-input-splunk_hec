# UF/HF httpout: distribute and trust the server CA/certificate on the sender.
# In the measured 10.6.1.1 httpout traffic no HEC GUID channel was supplied.
# Configure the receiving token with useACK=false for this mode; HEC ACK-enabled
# event/raw clients must supply a channel. `useACK` is not an httpout setting.
[httpout]
httpEventCollectorToken = REPLACE_WITH_CONFIGURED_TOKEN
uri = https://logs.example.test:8088
batchSize = 65536
batchTimeout = 5
sslVerifyServerCert = true
sslVerifyServerName = true
# Trust roots are set in server.conf [sslConfig], not in this stanza.

# Heavy forwarders only:
[indexAndForward]
index = false
