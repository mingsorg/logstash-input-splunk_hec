# Selected per-record metadata, independent of @metadata diagnostic provenance.
# _path/crcSalt are observed monitor keys; missing values are omitted, never inferred.
input {
  splunk_hec {
    state_directory => "/var/lib/logstash/hec-mapped"
    tokens_json => '${HEC_TOKENS_JSON}'
    s2s_tcp_enabled => true
    s2s_tcp_ssl_enabled => true
    ssl_self_signed_sans => "dns:localhost,dns:logs.example.test,ip:127.0.0.1"
    s2s_metadata_fields_json => '{"_path":"path","crcSalt":"salt"}'
    hec_metadata => "none"
  }
}
# Example selected output: "s2s_metadata":{"path":"/var/log/app.log","salt":"<SOURCE>"}
# Values are strings; indexed measurements stay in fields. No metadata-derived ID is added.
output { stdout { codec => json_lines } }
