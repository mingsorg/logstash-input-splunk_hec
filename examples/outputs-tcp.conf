# UF/HF classic cooked tcpout to the splunk_hec TCP listener.
# Distribute the generated public server.crt and set sslRootCAPath in server.conf
# [sslConfig]; see examples/server.conf. The classic protocol has no HEC token.
[tcpout]
defaultGroup = logstash

[tcpout:logstash]
server = logs.example.test:9997
sendCookedData = true
# ACK means "accepted into the Logstash queue", not output completion.
useACK = true
useSSL = true
sslVerifyServerCert = true
sslVerifyServerName = true
# compressed is optional; TLS senders may compress regardless (see docs/s2s-tcp.md).
compressed = false
