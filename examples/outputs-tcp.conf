# UF/HF classic cooked tcpout to the splunk_hec TCP listener.
# The classic protocol has no HEC token. See docs/configuration.md section 9.2.
#
# --- Default: plaintext (matches the listener default, s2s_tcp_ssl_enabled => false) -------
[tcpout]
defaultGroup = logstash

[tcpout:logstash]
server = logs.example.test:9997
sendCookedData = true
# ACK means "accepted into the Logstash queue", not output completion.
useACK = true
# compressed is optional; TLS senders may compress regardless (see docs/s2s-tcp.md).
compressed = false

# --- TLS: use these three lines INSTEAD when the listener has s2s_tcp_ssl_enabled => true ---
# The sender's setting must match the listener. Distribute the generated public server.crt and
# set sslRootCAPath in server.conf [sslConfig]; see examples/server.conf.
# useSSL = true
# sslVerifyServerCert = true
# sslVerifyServerName = true
